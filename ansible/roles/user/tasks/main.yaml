---
- name: Ensure admin user exists
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: "{{ admin_groups }}"
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Allow sudo without password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"

- name: Allow admin SSH access with deploy key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_authorized_key | default(lookup('env', 'ADMIN_AUTHORIZED_KEY'), true) }}"
    state: present
  when: (admin_authorized_key | default(lookup('env', 'ADMIN_AUTHORIZED_KEY'), true) | length) > 0
