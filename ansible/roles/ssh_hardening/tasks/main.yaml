---
- name: Ensure OpenSSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true

- name: Ensure /etc/issue exists (SSH banner source)
  ansible.builtin.file:
    path: /etc/issue
    state: file
    owner: root
    group: root
    mode: "0644"

- name: Harden sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^\\s*{{ item.key }}\\b"
    line: "{{ item.key }} {{ item.value }}"
    state: present
  loop:
    - { key: "Port", value: "{{ ssh_port }}" }
    - { key: "AuthenticationMethods", value: "publickey" }
    - { key: "PubkeyAuthentication", value: "yes" }
    - { key: "PermitEmptyPasswords", value: "no" }
    - { key: "PasswordAuthentication", value: "no" }
    - { key: "KbdInteractiveAuthentication", value: "no" }
    - { key: "ChallengeResponseAuthentication", value: "no" }
    - {
        key: "PermitRootLogin",
        value: "{{ 'yes' if ssh_allow_root_login else 'no' }}",
      }
    - { key: "ClientAliveInterval", value: "300" }
    - { key: "ClientAliveCountMax", value: "0" }
    - { key: "Banner", value: "/etc/issue" }
    - { key: "IgnoreRhosts", value: "yes" }
    - { key: "HostbasedAuthentication", value: "no" }
  notify: Restart ssh

- name: Validate sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false
