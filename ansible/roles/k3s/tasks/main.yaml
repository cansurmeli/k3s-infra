---
- name: Create k3s data directory
  ansible.builtin.file:
    path: "{{ k3s_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download k3s install script
  ansible.builtin.get_url:
    url: "https://get.k3s.io"
    dest: "/tmp/k3s_install.sh"
    mode: "0755"

- name: Check installed k3s version
  ansible.builtin.command: "{{ k3s_install_dir }}/k3s --version"
  register: k3s_installed_version
  changed_when: false
  failed_when: false

- name: Install or upgrade k3s server
  ansible.builtin.command: >
    sh /tmp/k3s_install.sh
    --write-kubeconfig-mode 644
    --tls-san {{ k3s_fqdn | default(ansible_host) }}
  environment:
    K3S_DATA_DIR: "{{ k3s_data_dir }}"
    INSTALL_K3S_BIN_DIR: "{{ k3s_install_dir }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: >
    k3s_installed_version.rc != 0
    or ("k3s version " ~ k3s_version) not in k3s_installed_version.stdout
