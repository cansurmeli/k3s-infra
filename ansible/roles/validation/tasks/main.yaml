---
- name: Verify data mount point exists
  ansible.builtin.command: mountpoint -q "{{ k3s_data_mountpoint }}"
  changed_when: false

- name: Verify k3s service enabled and running
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true

- name: Verify kubectl works
  ansible.builtin.command: kubectl get nodes
  register: validation_kubectl_nodes
  changed_when: false

- name: Show cluster nodes
  ansible.builtin.debug:
    var: validation_kubectl_nodes.stdout
