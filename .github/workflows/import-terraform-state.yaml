name: Import Terraform State

on:
  workflow_call:
    inputs:
      allow_empty_terraform_state:
        description: "Allow Terraform to create resources when state is empty"
        required: false
        type: string
        default: "false"
      project_name:
        description: "Project/resource name prefix"
        required: false
        type: string
        default: "k3s-main"
      tf_import_droplet_id:
        description: "Existing DigitalOcean Droplet ID for k3s-main"
        required: false
        type: string
        default: ""
      tf_import_volume_id:
        description: "Existing DigitalOcean Volume ID for k3s-main-data-01"
        required: false
        type: string
        default: ""
      tf_import_firewall_id:
        description: "Existing DigitalOcean Firewall ID for the real k3s-main firewall"
        required: false
        type: string
        default: ""
    secrets:
      do_spaces_access_key_id:
        required: true
      do_spaces_secret_access_key:
        required: true
      do_token:
        required: true

jobs:
  import:
    runs-on: ubuntu-latest
    environment: prod

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.0

      - name: Ensure Terraform state Space exists
        env:
          DO_SPACES_ACCESS_KEY_ID: ${{ secrets.do_spaces_access_key_id }}
          DO_SPACES_SECRET_ACCESS_KEY: ${{ secrets.do_spaces_secret_access_key }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'fra1' }}
        run: bash ../.github/scripts/ensure-spaces-bucket.sh

      - name: Initialize Terraform
        env:
          DO_SPACES_ACCESS_KEY_ID: ${{ secrets.do_spaces_access_key_id }}
          DO_SPACES_SECRET_ACCESS_KEY: ${{ secrets.do_spaces_secret_access_key }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'fra1' }}
        run: bash ../.github/scripts/terraform-init.sh

      - name: Import existing resources
        env:
          ALLOW_EMPTY_TERRAFORM_STATE: ${{ inputs.allow_empty_terraform_state }}
          PROJECT_NAME: ${{ inputs.project_name }}
          TF_IMPORT_DROPLET_ID: ${{ inputs.tf_import_droplet_id }}
          TF_IMPORT_FIREWALL_ID: ${{ inputs.tf_import_firewall_id }}
          TF_IMPORT_VOLUME_ID: ${{ inputs.tf_import_volume_id }}
          TF_VAR_do_token: ${{ secrets.do_token }}
        run: bash ../.github/scripts/terraform-import-existing.sh

      - name: Verify imported state
        env:
          TF_VAR_do_token: ${{ secrets.do_token }}
        run: terraform plan -var-file=envs/prod.tfvars
