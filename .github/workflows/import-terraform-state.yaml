name: Import Terraform State

on:
  workflow_dispatch:
    inputs:
      droplet_id:
        description: "Existing DigitalOcean Droplet ID for k3s-main"
        required: true
      volume_id:
        description: "Existing DigitalOcean Volume ID for k3s-main-data-01"
        required: true
      firewall_id:
        description: "Existing DigitalOcean Firewall ID for the real k3s-main firewall"
        required: true
      volume_attachment_id:
        description: "Existing volume attachment import ID. Usually <droplet_id>,<volume_id>; override if the provider reports a different ID."
        required: false

concurrency:
  group: terraform-state-prod
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    environment: prod

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.0

      - name: Initialize Terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'fra1' }}
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          cat > backend.hcl <<EOF
          bucket = "${TF_STATE_BUCKET}"
          key = "k3s-infra/prod/terraform.tfstate"
          region = "${TF_STATE_REGION}"
          endpoints = {
            s3 = "https://${TF_STATE_REGION}.digitaloceanspaces.com"
          }
          skip_credentials_validation = true
          skip_requesting_account_id = true
          skip_metadata_api_check = true
          skip_region_validation = true
          skip_s3_checksum = true
          EOF
          terraform init -backend-config=backend.hcl

      - name: Import existing resources
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          DROPLET_ID: ${{ inputs.droplet_id }}
          VOLUME_ID: ${{ inputs.volume_id }}
          FIREWALL_ID: ${{ inputs.firewall_id }}
          VOLUME_ATTACHMENT_ID: ${{ inputs.volume_attachment_id }}
        run: |
          set -euo pipefail
          if [ -z "${VOLUME_ATTACHMENT_ID}" ]; then
            VOLUME_ATTACHMENT_ID="${DROPLET_ID},${VOLUME_ID}"
          fi

          import_if_missing() {
            local address="$1"
            local id="$2"
            if terraform state show "${address}" >/dev/null 2>&1; then
              echo "${address} already exists in state"
            else
              terraform import -var-file=envs/prod.tfvars "${address}" "${id}"
            fi
          }

          import_if_missing digitalocean_droplet.k3s_main "${DROPLET_ID}"
          import_if_missing digitalocean_volume.k3s_data "${VOLUME_ID}"
          import_if_missing digitalocean_firewall.k3s_main_fw "${FIREWALL_ID}"
          import_if_missing digitalocean_volume_attachment.k3s_data_attach "${VOLUME_ATTACHMENT_ID}"

      - name: Verify imported state
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
        run: terraform plan -var-file=envs/prod.tfvars
