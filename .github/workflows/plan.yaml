name: Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/plan.yaml"
  workflow_dispatch:

concurrency:
  group: terraform-state-prod
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.0

      - name: Initialize Terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'fra1' }}
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          cat > backend.hcl <<EOF
          bucket = "${TF_STATE_BUCKET}"
          key = "k3s-infra/prod/terraform.tfstate"
          region = "${TF_STATE_REGION}"
          endpoints = {
            s3 = "https://${TF_STATE_REGION}.digitaloceanspaces.com"
          }
          skip_credentials_validation = true
          skip_requesting_account_id = true
          skip_metadata_api_check = true
          skip_region_validation = true
          skip_s3_checksum = true
          EOF
          terraform init -backend-config=backend.hcl

      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
        run: terraform plan -var-file=envs/prod.tfvars -out=tfplan
