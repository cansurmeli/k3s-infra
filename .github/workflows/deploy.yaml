name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "ansible/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy.yaml"
      - ".github/workflows/import-terraform-state.yaml"
  workflow_dispatch:

concurrency:
  group: terraform-state-prod
  cancel-in-progress: false

jobs:
  import-terraform-state:
    uses: ./.github/workflows/import-terraform-state.yaml
    with:
      allow_empty_terraform_state: ${{ vars.ALLOW_EMPTY_TERRAFORM_STATE || 'false' }}
      project_name: k3s-main
      tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      tf_import_droplet_id: ${{ vars.TF_IMPORT_DROPLET_ID }}
      tf_import_firewall_id: ${{ vars.TF_IMPORT_FIREWALL_ID }}
      tf_import_volume_attachment_id: ${{ vars.TF_IMPORT_VOLUME_ATTACHMENT_ID }}
      tf_import_volume_id: ${{ vars.TF_IMPORT_VOLUME_ID }}
    secrets:
      do_spaces_access_key_id: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      do_spaces_secret_access_key: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
      do_token: ${{ secrets.DO_TOKEN }}

  terraform-apply:
    runs-on: ubuntu-latest
    environment: prod
    needs: import-terraform-state

    defaults:
      run:
        shell: bash
        working-directory: terraform

    outputs:
      k3s_main_ip: ${{ steps.tfout.outputs.k3s_main_ip }}
      volume_device_hint: ${{ steps.tfout.outputs.volume_device_hint }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.0

      - name: Ensure Terraform state Space exists
        env:
          DO_SPACES_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          DO_SPACES_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'fra1' }}
        run: bash ../.github/scripts/ensure-spaces-bucket.sh

      - name: Initialize Terraform
        env:
          DO_SPACES_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          DO_SPACES_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'fra1' }}
        run: bash ../.github/scripts/terraform-init.sh

      - name: Refuse apply if Terraform state is still empty
        env:
          ALLOW_EMPTY_TERRAFORM_STATE: ${{ vars.ALLOW_EMPTY_TERRAFORM_STATE || 'false' }}
        run: |
          set -euo pipefail
          if ! terraform state list | grep -q .; then
            echo "Terraform state is empty."
            echo "Set ALLOW_EMPTY_TERRAFORM_STATE=true only for a first bootstrap into an empty DigitalOcean project."
            if [ "${ALLOW_EMPTY_TERRAFORM_STATE}" != "true" ]; then
              exit 1
            fi
          fi

      - name: Apply Terraform Plan
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
        run: terraform apply -var-file=envs/prod.tfvars -auto-approve

      - name: Export Terraform outputs
        id: tfout
        run: |
          set -euo pipefail
          echo "k3s_main_ip=$(terraform output -raw k3s_main_ip)" >> "$GITHUB_OUTPUT"
          echo "volume_device_hint=$(terraform output -raw volume_device_hint)" >> "$GITHUB_OUTPUT"

  ansible-deploy:
    runs-on: ubuntu-latest
    environment: prod
    needs: terraform-apply

    defaults:
      run:
        shell: bash
        working-directory: ansible

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Ansible + SSH Client
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible openssh-client

      - name: Start ssh-agent and deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-add - <<< "${SSH_PRIVATE_KEY}"
          echo "ADMIN_AUTHORIZED_KEY=$(ssh-add -L | head -n 1)" >> "$GITHUB_ENV"

      - name: Resolve SSH target and trust host key
        id: ssh_target
        env:
          K3S_MAIN_IP: ${{ needs.terraform-apply.outputs.k3s_main_ip }}
        run: |
          set -euo pipefail
          SSH_PORT="$(awk -F': *' '/^ssh_port:/ {gsub(/"/, "", $2); print $2}' group_vars/prod.yaml)"
          ADMIN_USER="$(awk -F': *' '/^admin_user:/ {gsub(/"/, "", $2); print $2}' group_vars/prod.yaml)"

          echo "Waiting for SSH on ${K3S_MAIN_IP} to become available..."
          for i in $(seq 1 60); do
            if nc -z "${K3S_MAIN_IP}" 22 || nc -z "${K3S_MAIN_IP}" "${SSH_PORT}"; then
              echo "SSH is available!"
              break
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "SSH did not become available in time. Exiting."
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${K3S_MAIN_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H -p "${SSH_PORT}" "${K3S_MAIN_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

          if ssh -o BatchMode=yes -p 22 "root@${K3S_MAIN_IP}" true; then
            echo "ansible_user=root" >> "$GITHUB_OUTPUT"
            echo "ansible_port=22" >> "$GITHUB_OUTPUT"
          elif ssh -o BatchMode=yes -p "${SSH_PORT}" "${ADMIN_USER}@${K3S_MAIN_IP}" true; then
            echo "ansible_user=${ADMIN_USER}" >> "$GITHUB_OUTPUT"
            echo "ansible_port=${SSH_PORT}" >> "$GITHUB_OUTPUT"
          else
            echo "Could not authenticate to ${K3S_MAIN_IP} as root:22 or ${ADMIN_USER}:${SSH_PORT}."
            exit 1
          fi

      - name: Generate Ansible inventory
        env:
          K3S_MAIN_IP: ${{ needs.terraform-apply.outputs.k3s_main_ip }}
          ANSIBLE_USER: ${{ steps.ssh_target.outputs.ansible_user }}
          ANSIBLE_PORT: ${{ steps.ssh_target.outputs.ansible_port }}
        run: |
          set -euo pipefail
          mkdir -p inventories/prod
          cat > inventories/prod/hosts.ini <<EOF
          [k3s_main]
          k3s-main-01 ansible_host=${K3S_MAIN_IP} ansible_user=${ANSIBLE_USER} ansible_port=${ANSIBLE_PORT}

          [prod:children]
          k3s_main
          EOF
          cat inventories/prod/hosts.ini

      - name: Prepare Ansible Vault password
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${ANSIBLE_VAULT_PASSWORD}" ]; then
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          fi

      - name: Run Ansible
        env:
          ADMIN_AUTHORIZED_KEY: ${{ env.ADMIN_AUTHORIZED_KEY }}
          VOLUME_DEVICE_HINT: ${{ needs.terraform-apply.outputs.volume_device_hint }}
        run: |
          set -euo pipefail
          ansible_args=(
            -i inventories/prod/hosts.ini
            site.yaml
            --extra-vars "k3s_data_device=${VOLUME_DEVICE_HINT}"
          )

          if [ -f .vault_pass ]; then
            ansible_args+=(--vault-password-file .vault_pass)
          fi

          ansible-playbook "${ansible_args[@]}"
      - name: Smoke check (placeholder)
        env:
          K3S_MAIN_IP: ${{ needs.terraform-apply.outputs.k3s_main_ip }}
        run: |
          set -euo pipefail
          echo "Droplet IP: ${K3S_MAIN_IP}"
          timeout 5 bash -c "echo ok"
